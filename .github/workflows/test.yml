name: Regression tests

# Runs the full suite in tests/run.js against every push and pull request, so a regression shows
# up as a red check on GitHub instead of depending on someone remembering to test by hand.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the test harness from index.html
        run: python3 tests/harness/build_test_visual.py

      - name: Start the test harness server
        run: |
          node tests/harness/server.js &
          for i in $(seq 1 20); do
            curl -sf http://localhost:8899/test-visual.html > /dev/null && break
            sleep 0.5
          done

      - name: Run regression suite
        run: node tests/run.js
