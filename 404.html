<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found | Evolve+</title>
  <script>
    /* GitHub Pages serves this file for any URL that has no file behind it.
       The one case we can recover: /p/<slug>/ for a page that exists in the app but has no generated
       crawlable copy yet (e.g. created since the last scripts/prerender.js run). Send it into the app
       the same way a #/page/ link would. Anything else falls through to the message below. */
    (function () {
      var m = location.pathname.match(/^\/p\/([^\/]+)\/?$/);
      if (!m) return;
      try {
        location.replace('/' + location.search + '#/page/' + encodeURIComponent(decodeURIComponent(m[1])));
      } catch (e) {}
    })();
  </script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f1f5f9; color: #0f172a; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; }
    a { color: #1d4ed8; font-weight: 600; }
  </style>
</head>
<body>
  <div>
    <h1 style="font-size:1.5rem;margin:0 0 .5rem">Page not found</h1>
    <p style="margin:0 0 1rem;color:#475569">This link doesn't lead anywhere.</p>
    <a href="/">Go to Evolve+ home</a>
  </div>
</body>
</html>
